[project]
name = "hypothesis-factory"
version = "0.1.0"
description = "Фабрика гипотез по хвостам обогащения — детерминированный граф из данных, LLM только оформляет текст"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "openpyxl>=3.1",
    "pymupdf>=1.28.0",
    "reportlab>=5.0.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"factory/*" = ["E402"]
"webapp/*" = ["E402"]
